name: Test on_tag_exists skip behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          tag_name: v0.0.4-skip-test
          on_tag_exists: skip
          type: commit
          debug: "true"

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          NODE_ID: ${{ steps.action.outputs.node_id }}
          TAG_NAME: ${{ steps.action.outputs.tag_name }}
          TAG_SHA: ${{ steps.action.outputs.tag_sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "node_id: $NODE_ID"
          echo "tag_name: $TAG_NAME"
          echo "tag_sha: $TAG_SHA"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TAG_NAME" ]; then
              echo "FAIL: action succeeded but tag_name output is empty"
              exit 1
            fi
            echo "PASS: tag created with skip policy, tag_name=$TAG_NAME"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
